version: '3.8'

services:
  # Development Backend (with hot reload)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - backend_target:/app/target
    environment:
      RUST_LOG: debug
    command: cargo watch -x run

  # Development Frontend (with hot reload) 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    command: npm run dev

volumes:
  backend_target:
  frontend_node_modules:
